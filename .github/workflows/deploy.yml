name: Deploy NestJS Backend to cPanel

on:
  push:
    branches:
      - main
      - Develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build NestJS Application
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f "dist/main.js" ]; then
            echo "Error: dist/main.js was not generated by nest build!"
            exit 1
          fi

      - name: Prepare Release Bundle
        run: |
          mkdir -p release
          cp -r dist release/
          cp app.js release/
          cp package.json release/
          cp package-lock.json release/

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Configure Known Hosts
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync Release to cPanel
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          # Sync release bundle into cPanel app directory
          # Preserves .env, uploads, node_modules, and tmp on the server
          rsync -avz --delete \
            --exclude='.env*' \
            --exclude='uploads/' \
            --exclude='node_modules/' \
            --exclude='tmp/' \
            -e "ssh -p $PORT" \
            release/ \
            "${SSH_USER}@${SSH_HOST}:${APP_PATH}/"

      - name: Post-Deploy (Dependencies & Passenger Restart)
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          NODE_ENV_ACTIVATE: ${{ secrets.CPANEL_NODE_ENV_ACTIVATE }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "${SSH_USER}@${SSH_HOST}" << EOF
            set -e

            echo "Navigating to app directory: $APP_PATH"
            cd "$APP_PATH"

            # Activate cPanel Node.js virtual environment if provided
            if [ -n "$NODE_ENV_ACTIVATE" ]; then
              echo "Activating Node environment..."
              $NODE_ENV_ACTIVATE
            fi

            echo "Node version on server: \$(node -v 2>/dev/null || echo 'not loaded')"
            echo "Installing production dependencies on server..."
            npm ci --omit=dev --no-audit

            # Uncomment below if you want automated TypeORM migrations on every deploy:
            # echo "Running migrations..."
            # npm run migration:run

            echo "Restarting cPanel Passenger..."
            mkdir -p tmp
            touch tmp/restart.txt

            echo "Backend successfully deployed and restarted!"
EOF